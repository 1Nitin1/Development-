<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let name = prompt("Please enter your name:");
        if (name) {
            document.write("<h1>Hello, " + name + "!</h1>");
        } else {
            document.write("<h1>Hello, Guest!</h1>");
        }
    </script>
</body>
</html>
