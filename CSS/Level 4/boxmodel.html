<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Common styles for all boxes */
        /*Margin, border, padding*/
        #Box1 {
            height:200px;
            width:200px;
            padding:10px 20px 30px 40px;
            border: 4px solid black;
            margin-bottom: 20px;
            background-color: lightgray;
        }
        #Box2 {
            height:200px;
            width:200px;
            padding:10px 20px 30px 40px;
            border: 4px solid black;
            margin-top: 50px;
            border-top: 20px dashed red;
            background-color: lightgray;
        }
        #Box3 {
            height:200px;
            width:200px;
            padding:10px 20px 30px 40px;
            border: 4px solid black;
            margin-top: 20px;
            border-radius: 10px 200px 10px 10px;
            background-color: lightgray;
        }
    </style>
</head>
<body>
    <div id="Box1" class="box" style="text-align:center;">Box 1</div>
    <div id="Box2" class="box" style="text-align:center;">Box 2</div>
    <div id="Box3" class="box" style="text-align:center;">Box 3</div>
</body>
</html>
