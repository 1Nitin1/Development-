<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container {
            position: relative;
            height: 200px;
            width: 400px;
            background-color: lightgray;
        }
        #Box1 {
            position: absolute;
            top: 50px;
            left: 50px;
            height: 100px;
            width: 100px;
            background-color: blue;
            z-index: 1;
        }
        #Box2 {
            position: absolute;
            top: 80px;
            left: 80px;
            height: 100px;
            width: 100px;
            background-color: red;
            z-index: 2;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="Box1">Box 1</div>
        <div id="Box2">Box 2</div>
    </div>
</body>
</html>
