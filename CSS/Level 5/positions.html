<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing: content-box;
        }
        .Box{
            height: 200px;
            width: 200px;
            background-color: lightgray;
            margin: 20px;
            border: 4px solid black;
            line-height: 200px;
            text-align: center;
            font-weight: bold;
        }
        #Box1{
            position: static;
        }
        #Box2{
            position: relative;
            bottom: 228px;
            left: 220px;
        }
        #Box3{
            position: absolute;
            top: 0px;
            left: 440px;
        }
        #Box4{
            position: fixed;
            bottom: 0;
            right: 0;
        }
    </style>
</head>
<body>
    <div id="Box1" class="Box">Static</div>
    <div id="Box2" class="Box">Relative</div>
    <div id="Box3" class="Box">Absolute</div>
    <div id="Box4" class="Box">Fixed</div>
</body>
</html>
