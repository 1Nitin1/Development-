<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //property shorthand
        let price=860;
        let product={
            company:'Mango',
            price,
            item_name:'T-shirt',
            nitin:{
                age:19,
                course:'btech'
            },
            //method shorthand getPrice(){}
            getPriceAndAge: function(){
                return `${this.price} and ${this.nitin.age}`;
            }
        };
        //destructuring
        let {company}=product;
        console.log(company)

        console.log(product.company='banana');
        delete product.company;
        console.log(product.getPriceAndAge());
    </script>
</body>
</html>
