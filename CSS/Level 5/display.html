<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            display: inline-block;
            /*block, inline, none*/
            width: 100px;
            height: 100px;
            margin: 10px;
            background-color: lightblue;
            border: 2px solid black;
            line-height: 100px; /* Vertically center text */
        }
    </style>
</head>
<body>
    <div id="Box1" class="box" style="text-align:center;">Box 1</div>
    <div id="Box2" class="box" style="text-align:center;">Box 2</div>
    <div id="Box3" class="box" style="text-align:center;">Box 3</div>
</body>
</html>
