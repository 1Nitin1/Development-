<body>
<script>
    let items=prompt("Enter the number of items you want to buy:");
    const costPerItem=799;
    const gst=18;
    let totalCost=items*costPerItem;
    let gstAmount=(totalCost*gst)/100;
    let finalAmount=totalCost+gstAmount;
    document.write("<h1>Total Cost including GST: ₹"+finalAmount+"</h1>");
    console.log(eval('1+2-3'));
    
</script>
