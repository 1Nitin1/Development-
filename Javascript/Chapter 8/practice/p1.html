<body>
    <script>
        let date = new Date();
        let hour = date.getHours();
        alert(hour);
        let name = 'Nitin';
        if(hour>=4 && hour<12){
            alert( `good morning ${name}`);
        }else if(hour>=12 && hour<18){
            alert(`good afternoon ${name}`);
        }else{
            alert(`good night ${name}`);
        }
    </script>
</body>
