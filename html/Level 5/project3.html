<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h3><u>Contact Me</u></h3>
    <form>
        <label for="name">Name :</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" required>
        <br><br>

        <label for="email">Email :</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>
        <br><br>

        <label for="phonenumber">Phone Number :</label>
        <input type="number" id="phonenumber" name="phonenumber" placeholder="Enter your phone number">
        <br><br>

        <label for="message">Message :</label>
        <textarea id="message" name="message" rows="4" cols="30" placeholder="Enter your message here" required></textarea>
        <br><br>

        <input type="submit" value="Submit">
    </form>

</body>
</html>
