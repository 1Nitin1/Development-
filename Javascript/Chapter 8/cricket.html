<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        #game{
            height:400px;
            width:500px;
            border:4px solid black;
            border-radius: 30px;
            position:absolute;
            top:50%;
            left:50%;
            transform: translate(-50%,-50%);
            overflow: hidden;
        }
        h3{
            text-align: center;
            font-size: 25px;
            width:100%;
            height:40px;
            line-height: 30px;
            text-transform: capitalize;
            border: 2px dashed black;
        }
        .choices{
            margin:20px;
            height:120px;
            width:120px;
            border-radius: 60px;
            background-size:contain ;
            background-color: aqua;
        }
        #bat{
            background-image: url('../../../assets/cricket-bat-clipart-cartoon-illustration-drawing_871209-14062.avif');
        }
        #ball{
            background-image: url('../../../assets/OIP.webp');
        }
        #stump{
            background-image: url('../../../assets/cricket-stump-vector-illustration_642458-2427.avif');
        }
        #reset{
            width:100%;
            height:30px;
            text-transform: uppercase;
            font-weight: 600;
            font-size: 20px;
        }
        #result{
            text-align: center;
            
            border:2px dotted black;
            width:100%;
            height: 30px;
            line-height: 25px;;
        }
        #summary{
            text-align: center;
            margin:20px;
            position:relative;
            top:30px;
        }

    </style>
</head>
<body>
    <div id="game">
        <h3>Start playing</h3>
        <button id="bat" class="choices" onclick="result('bat'); getSummary();"></button>
        <button id="ball" class="choices" onclick="result('ball'); getSummary();"></button>
        <button id="stump" class="choices" onclick="result('stump'); getSummary();"></button>
        <button id="reset" onclick="reset();">Reset</button>
        <p id="result">Make your choice!</p>
        <p id="summary"></p>
    </div>
    <script>
        let userChoice="";
        let summary={
            win:0,
            draw:0,
            lose:0
        };
        let computerChoice='';
        summary=JSON.parse(localStorage.getItem('summary'))??summary;
        function reset(){
            localStorage.setItem('summary',JSON.stringify({
            win:0,
            draw:0,
            lose:0
        }));
            summary={
                win:0,
                draw:0,
                lose:0
            }
            document.querySelector('#result').innerHTML="Make your choice!";
            document.querySelector('#summary').innerHTML=`WINS : ${summary.win},\nDRAWS : ${summary.draw},\nLOSES : ${summary.lose}`;
        }
        
        
        
        document.querySelector('#summary').innerHTML=`WINS : ${summary.win},\nDRAWS : ${summary.draw},\nLOSES : ${summary.lose}`;
        function getSummary(){
            document.querySelector('#summary').innerHTML=`WINS : ${summary.win},\nDRAWS : ${summary.draw},\nLOSES : ${summary.lose}`;
        }
        
        function computer(){
            const arr=['bat','ball','stump'];
            computerChoice=arr[Math.floor(Math.random()*3)];
        }
        function result(name){
            userChoice=name;
            computer();
            if(userChoice===computerChoice){
                document.querySelector('#result').innerHTML="It's a tie! Both chose "+userChoice;
                summary.draw++;
            }
            else if((userChoice==='bat' && computerChoice==='ball')||(userChoice==='ball' && computerChoice==='stump')||(userChoice==='stump' && computerChoice==='bat')){
                document.querySelector('#result').innerHTML="You win! You chose "+userChoice+" and computer chose "+computerChoice;
                summary.win++;
            }
            else{
                document.querySelector('#result').innerHTML="Computer wins! You chose "+userChoice+" and computer chose "+computerChoice;
                summary.lose++;
            }
            localStorage.setItem('summary',JSON.stringify(summary));
        };
        
    </script>
</body>
</html>
